name: YourOwnVariables
main: yov.YOVPlugin
version: 5.0
author: Haizenfell
api-version: 1.13
depend: [PlaceholderAPI, HuskSync]

commands:
  yov:
    description: Player variable management
    usage: "/<command> <help|reload|set|rem|add|delete|check|userclear>"

permissions:
  yov.admin:
    description: Allows the use of /yov commands
    default: op
