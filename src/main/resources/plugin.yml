name: YourOwnVariables
main: yov.YOVPlugin
version: '${project.version}'
author: Haizenfell
api-version: '26.3'
depend: [PlaceholderAPI, HuskSync]
libraries:
  # YOV uses a separate request/ack channel on the Redis configured in HuskSync.
  # Paper downloads and caches the required library.
  - 'io.lettuce:lettuce-core:6.6.0.RELEASE'

commands:
  yov:
    description: Player variable management
    usage: "/<command> <help|reload|status|set|rem|add|delete|check|userclear>"

permissions:
  yov.admin:
    description: Allows the use of /yov commands
    default: op
